name: tactic_flutter
description: Mate en 2 Trainer y visor de partidas TCEC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  chess: ^0.8.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/
    - assets/puzzles.jsonl
    - assets/games_part0.jsonl
    - assets/games_part1.jsonl
    - assets/games_part2.jsonl
