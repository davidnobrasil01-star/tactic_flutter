<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>GMchess</title>
<style>
:root {
  --light: #f0d9b5;
  --dark: #b58863;
  --panel-bg: #262421;
  --panel-bg-2: #302e2c;
  --text: #e8e6e3;
  --muted: #a5a49f;
  --accent: #7fa650;
  --danger: #c8462a;
  --highlight: rgba(205, 210, 106, 0.82);
  --square-size: 26px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--panel-bg);
  overflow: hidden;
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#tab-bar {
  display: flex;
  justify-content: center;
  gap: 4px;
  padding: 6px 8px 0;
}
#tab-bar button {
  background: var(--panel-bg-2);
  color: var(--muted);
  border: none;
  border-radius: 5px 5px 0 0;
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
#tab-bar button.active {
  background: var(--accent);
  color: #1b1b1b;
}
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* ─── Panel ─── */
#panel {
  background: var(--panel-bg);
  border-radius: 0 0 8px 8px;
  padding: 8px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  color: var(--text);
}

/* ─── Topbar ─── */
.topbar {
  width: calc(var(--square-size) * 8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 4px;
}
#opening-line {
  font-size: 9px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
#result-badge {
  background: var(--accent);
  color: #1b1b1b;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
}
.topbar-right { display: flex; align-items: center; gap: 5px; }
.maximize-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 11px;
  line-height: 1;
  padding: 2px;
  cursor: pointer;
  opacity: 0.6;
  border-radius: 3px;
}
.maximize-btn:hover { opacity: 1; background: rgba(255,255,255,0.08); }

/* ─── Puzzle topbar ─── */
#puzzle-info { font-size: 11px; font-weight: 600; color: var(--muted); }
#solved-count { margin-left: 5px; color: var(--accent); font-weight: 700; }
.tag {
  background: var(--accent);
  color: #1b1b1b;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
  margin-right: 4px;
}
.hidden { display: none !important; }

/* ─── Clock ─── */
#clock-wrap { position: relative; width: 20px; height: 20px; }
#clock-ring { width: 20px; height: 20px; transform: rotate(-90deg); }
.ring-bg, #ring-progress { fill: none; stroke-width: 5; }
.ring-bg { stroke: #3d3a36; }
#ring-progress {
  stroke: var(--accent);
  stroke-linecap: round;
  stroke-dasharray: 119.4;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
}
#ring-progress.low { stroke: var(--danger); }
#clock-time {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  font-weight: 700;
}

/* ─── Board ─── */
#board-wrap {
  position: relative;
  width: calc(var(--square-size) * 8);
  height: calc(var(--square-size) * 8);
  border-radius: 3px;
  overflow: hidden;
}
#board, #pieces-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
}
#pieces-layer { pointer-events: none; }
.square {
  position: absolute;
  width: var(--square-size);
  height: var(--square-size);
}
.square.light { background: var(--light); }
.square.dark { background: var(--dark); }
.square.last-move { background-image: linear-gradient(var(--highlight), var(--highlight)); }
.square.selected { background-image: linear-gradient(rgba(130, 151, 105, 0.75), rgba(130, 151, 105, 0.75)); }
.square.check { background: radial-gradient(ellipse at center, rgba(235,0,0,0.9) 0%, rgba(235,0,0,0.5) 25%, rgba(235,0,0,0) 89%); }
.coord {
  position: absolute;
  font-size: 6px;
  font-weight: 700;
  pointer-events: none;
  line-height: 1;
}
.coord.file { bottom: 1px; right: 2px; }
.coord.rank { top: 1px; left: 2px; }
.coord.on-light { color: var(--dark); }
.coord.on-dark { color: var(--light); }
.legal-dot {
  position: absolute;
  width: var(--square-size);
  height: var(--square-size);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.legal-dot::after {
  content: "";
  width: 28%;
  height: 28%;
  border-radius: 50%;
  background: rgba(20, 20, 20, 0.3);
}
.legal-dot.capture::after {
  width: 82%;
  height: 82%;
  background: transparent;
  border: 3px solid rgba(20, 20, 20, 0.3);
  box-sizing: border-box;
}
.piece {
  position: absolute;
  width: var(--square-size);
  height: var(--square-size);
  pointer-events: auto;
  cursor: grab;
  z-index: 5;
  touch-action: none;
}
.piece.dragging {
  z-index: 20;
  cursor: grabbing;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4));
}

/* ─── Player line (games) ─── */
.player-line {
  width: calc(var(--square-size) * 8);
  display: flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  margin: 4px 0;
}
.player-line .name-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  flex: 0 1 auto;
}
.player-line .elo { color: var(--muted); font-weight: 400; flex: 0 0 auto; white-space: nowrap; }
.player-line .piece-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 5px;
  flex: 0 0 auto;
}
.player-line .piece-dot.w { background: var(--light); border: 1px solid var(--muted); }
.player-line .piece-dot.b { background: var(--dark); border: 1px solid var(--muted); }

/* ─── Move/Calc line (games) ─── */
#move-line { margin-top: 6px; font-size: 10px; color: var(--muted); }
#calc-line {
  margin-top: 3px;
  width: calc(var(--square-size) * 8);
  font-size: 9px;
  color: #d8b45c;
  text-align: center;
  white-space: normal;
  line-height: 1.3;
}

/* ─── Controls (games) ─── */
#controls { margin-top: 6px; display: flex; gap: 4px; }
#controls button {
  background: var(--panel-bg-2);
  color: var(--text);
  border: none;
  border-radius: 5px;
  padding: 5px 8px;
  font-size: 12px;
  cursor: pointer;
  line-height: 1;
}
#controls button:hover { background: rgba(255,255,255,0.1); }
#controls button.active { background: var(--accent); color: #1b1b1b; }

/* ─── Turn hint (puzzle) ─── */
#turn-hint {
  margin-top: 5px;
  font-size: 10px;
  color: var(--muted);
  min-height: 12px;
  text-align: center;
}

/* ─── Feedback (puzzle) ─── */
#feedback {
  margin-top: 6px;
  width: calc(var(--square-size) * 8);
  background: var(--panel-bg-2);
  border-radius: 6px;
  padding: 7px 8px;
  text-align: center;
}
#feedback.hidden { display: none; }
#feedback-title { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
#feedback-title.ok { color: var(--accent); }
#feedback-title.fail { color: var(--danger); }
#feedback-pattern { font-size: 9px; color: #d8b45c; margin-bottom: 2px; }
#feedback-time { font-size: 9px; color: var(--muted); margin-bottom: 2px; }
#feedback-line { font-size: 9px; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
#next-btn {
  background: var(--accent);
  color: #1b1b1b;
  border: none;
  border-radius: 5px;
  padding: 4px 10px;
  font-weight: 700;
  font-size: 10px;
  cursor: pointer;
}
#next-btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<div id="tab-bar">
  <button id="tab-puzzle" class="active" onclick="switchTab('puzzle')">Mate en 2</button>
  <button id="tab-games" onclick="switchTab('games')">Motor vs Motor</button>
</div>

<!-- ═══════ PUZZLE SCREEN ═══════ -->
<div id="screen-puzzle" class="screen active">
  <div id="panel">
    <div class="topbar">
      <div id="puzzle-info" title="">
        <span id="review-tag" class="tag hidden">R</span>
        <span id="puzzle-rating"></span>
        <span id="solved-count"></span>
      </div>
      <div class="topbar-right">
        <button id="maximize-btn-puzzle" class="maximize-btn" title="Agrandar/achicar tablero">⤢</button>
        <div id="clock-wrap">
          <svg id="clock-ring" viewBox="0 0 44 44">
            <circle class="ring-bg" cx="22" cy="22" r="19"></circle>
            <circle id="ring-progress" cx="22" cy="22" r="19"></circle>
          </svg>
          <span id="clock-time">60</span>
        </div>
      </div>
    </div>

    <div id="board-wrap">
      <div id="board"></div>
      <div id="pieces-layer"></div>
    </div>

    <div id="turn-hint">Mate en 2</div>

    <div id="feedback" class="hidden">
      <div id="feedback-title"></div>
      <div id="feedback-pattern"></div>
      <div id="feedback-time"></div>
      <div id="feedback-line"></div>
      <button id="next-btn">Siguiente</button>
    </div>
  </div>
</div>

<!-- ═══════ GAMES SCREEN ═══════ -->
<div id="screen-games" class="screen">
  <div id="panel-games">
    <div class="topbar">
      <div id="opening-line"></div>
      <div class="topbar-right">
        <button id="maximize-btn-games" class="maximize-btn" title="Agrandar/achicar tablero">⤢</button>
        <span id="result-badge"></span>
      </div>
    </div>

    <div id="player-top" class="player-line"></div>

    <div id="board-wrap-games">
      <div id="board-games"></div>
      <div id="pieces-layer-games"></div>
    </div>

    <div id="player-bottom" class="player-line"></div>

    <div id="move-line">Jugada <span id="move-index">0</span>/<span id="move-total">0</span></div>
    <div id="calc-line"></div>

    <div id="controls">
      <button id="btn-start" title="Ir al inicio">⏮</button>
      <button id="btn-prev" title="Jugada anterior">◀</button>
      <button id="btn-play" title="Reproducir">▶</button>
      <button id="btn-next" title="Jugada siguiente">▶</button>
      <button id="btn-end" title="Ir al final">⏭</button>
      <button id="btn-new" title="Otra partida (N)">🔀</button>
      <button id="btn-lichess" title="Ver esta posición en Lichess">♞</button>
    </div>
  </div>
</div>

<script src="chess.js"></script>
<script src="bridge.js"></script>
<script src="puzzle-renderer.js"></script>
<script src="games-renderer.js"></script>
<script>
function switchTab(tab) {
  document.getElementById('tab-puzzle').className = tab === 'puzzle' ? 'active' : '';
  document.getElementById('tab-games').className = tab === 'games' ? 'active' : '';
  document.getElementById('screen-puzzle').className = tab === 'puzzle' ? 'screen active' : 'screen';
  document.getElementById('screen-games').className = tab === 'games' ? 'screen active' : 'screen';
  if (tab === 'games' && !window._gamesLoaded) {
    window._gamesLoaded = true;
    if (typeof loadRandomGame === 'function') loadRandomGame();
  }
}
</script>
</body>
</html>
